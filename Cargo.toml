[package]
name = "clean-language-compiler"
version = "0.10.3"
authors = ["Ivan Pasco Lizarraga"]
edition = "2021"
homepage = "https://www.cleanlanguage.dev"
repository = "https://github.com/cleanlang/clean-language-compiler"
description = "A modern, type-safe programming language that compiles to WebAssembly"
license = "MIT"
readme = "README.md"
keywords = ["compiler", "webassembly", "wasm", "programming-language", "type-safe"]
categories = ["compilers", "wasm", "development-tools"]


[dependencies]
# Parsing
pest = "2.7"
pest_derive = "2.7"
lazy_static = "1.5"

# WebAssembly
wasm-encoder = "0.35"
wasmparser = "0.121"
wat = "1.0.71"
wasm-opt = "0.116"  # Binaryen WebAssembly optimizations

# WebAssembly Runtimes (feature-gated)  
wasmtime = { version = "10.0", optional = true }
wasmer = { version = "4.3", optional = true, features = ["cranelift", "sys"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Package management
dirs = "5.0"

# Utilities
regex = "1.11"
rand = "0.8"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }

# Logging and tracing
env_logger = "0.10"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Memory management and collections
indexmap = "2.0"
hashbrown = "0.14"

# String processing and unicode
unicode-normalization = "0.1"
unicode-segmentation = "1.10"

# Development tools
num_cpus = "1.16"
tempfile = "3.8"

# HTTP client for real network requests (using native-tls for better macOS compatibility)
reqwest = { version = "0.11", features = ["blocking", "json", "native-tls"], default-features = false }

# System utilities
libc = "0.2"

[profile.release]
# WebAssembly optimization settings for best performance
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Faster dev builds while maintaining debug info
opt-level = 1
debug = true

[profile.test]
# Optimized testing profile
opt-level = 1
debug = true
codegen-units = 16
incremental = true

[profile.bench]
# Benchmarking profile
opt-level = 3
lto = false
codegen-units = 1

# Clippy configuration
# Basic checks enabled to catch common issues and code smells
# Pedantic/nursery remain disabled until warning backlog is cleared
[lints.clippy]
all = { level = "warn", priority = -1 }  # Enable basic clippy checks
pedantic = "allow"  # Keep pedantic disabled (too strict for current codebase)
nursery = "allow"  # Keep nursery disabled (experimental lints)
cargo = { level = "warn", priority = -1 }  # Enable cargo manifest checks

# Allow specific patterns that are intentional in our codebase
too_many_arguments = "allow"  # Compiler functions often need many arguments
large_enum_variant = "allow"  # AST/HIR enums have naturally large variants
module_inception = "allow"  # mod.rs pattern is standard in Rust
multiple_crate_versions = "allow"  # Transitive dependencies can have version conflicts

# Allow stylistic lints that don't affect functionality
uninlined_format_args = "allow"  # Format string style preference
needless_borrows_for_generic_args = "allow"  # Often clearer with explicit borrows
only_used_in_recursion = "allow"  # Self parameter in recursive methods is intentional
needless_return = "allow"  # Explicit returns improve readability in some cases
collapsible_match = "allow"  # Nested matches can be clearer than collapsed ones
collapsible_if = "allow"  # Separate if statements can be clearer
vec_init_then_push = "allow"  # Sometimes clearer than vec! macro
manual_map = "allow"  # Explicit if-let can be more readable
needless_match = "allow"  # Explicit matching can be more intention-revealing
redundant_locals = "allow"  # Can improve readability with renamed bindings
for_kv_map = "allow"  # Iterating over entries can be clearer
map_entry = "allow"  # Explicit contains_key/insert can be clearer
enum_variant_names = "allow"  # Descriptive names like TypeParameter are clear
upper_case_acronyms = "allow"  # Common acronyms like GUFA are standard
single_match_else = "allow"  # Match can be clearer than if-let with else
comparison_to_empty = "allow"  # .is_empty() not always more readable
match_like_matches_macro = "allow"  # Explicit match can be more clear
needless_late_init = "allow"  # Sometimes needed for scope reasons
let_and_return = "allow"  # Named returns improve debugging
needless_bool = "allow"  # Explicit bool conversion can be clearer
bool_assert_comparison = "allow"  # assert_eq!(x, true) can be more explicit
derivable_impls = "allow"  # Custom impls can have specific initialization logic
redundant_pattern_matching = "allow"  # Explicit pattern matching is clearer
wrong_self_convention = "allow"  # to_* methods don't always need to consume self
type_complexity = "allow"  # Complex types are sometimes necessary in compilers
approx_constant = "allow"  # Test values like 3.14 are intentional
map_identity = "allow"  # Can be clearer for error propagation
deref_addrof = "allow"  # Sometimes needed for type conversions
while_let_loop = "allow"  # Loop with break can be clearer
needless_range_loop = "allow"  # Index access can be clearer than enumerate
redundant_slicing = "allow"  # Explicit slicing documents intent
field_reassign_with_default = "allow"  # Explicit field setting is clear
missing_fields_in_debug = "allow"  # Not all fields need debug output
implicit_hasher = "allow"  # Generic hashers add unnecessary complexity
new_without_default = "allow"  # Not all new() methods should have Default
if_same_then_else = "allow"  # Sometimes needed for different branches
needless_borrow = "allow"  # Can improve clarity in some contexts
single_match = "allow"  # Match can be more extensible than if-let
match_ref_pats = "allow"  # & patterns can improve clarity
manual_range_contains = "allow"  # Explicit range checks can be clearer
or_fun_call = "allow"  # or_else closure not always beneficial
unnecessary_unwrap = "allow"  # Can be clearer than combinators
unused_enumerate_index = "allow"  # enumerate provides context even if index unused
iter_cloned_collect = "allow"  # to_vec() not always more clear
unwrap_or_default = "allow"  # Explicit unwrap_or can be clearer
incompatible_msrv = "allow"  # We use features from latest stable
manual_ok_err = "allow"  # Explicit match can be clearer
useless_format = "allow"  # format! can improve consistency
unnecessary_lazy_evaluations = "allow"  # Closures can improve clarity
unit_arg = "allow"  # Passing () explicitly can be clearer
len_zero = "allow"  # .len() == 0 can be more explicit
cast_abs_to_unsigned = "allow"  # Explicit casts document intent
unnecessary_cast = "allow"  # Casts can document type expectations
new_ret_no_self = "allow"  # new() can return different types
manual_strip = "allow"  # Manual prefix/suffix removal can be clearer
unnecessary_map_or = "allow"  # map_or can be more explicit
explicit_auto_deref = "allow"  # Explicit derefs improve clarity
get_first = "allow"  # [0] can be more direct than .first()
question_mark = "allow"  # Explicit error handling can be clearer
clone_on_copy = "allow"  # .clone() makes copy intent explicit
unnecessary_get_then_check = "allow"  # Separate get and check can be clearer
expect_fun_call = "allow"  # expect with format! is acceptable in tests
assertions_on_constants = "allow"  # Constant assertions document invariants in tests
double_ended_iterator_last = "allow"  # .last() on slice is clear
manual_div_ceil = "allow"  # Manual ceiling division is clear and explicit

[lints.rust]
# Allow deprecated warnings - we're in active migration
deprecated = "allow"  # Allow use of deprecated APIs during migration

[dev-dependencies]
# Testing
insta = "1.34"
pretty_assertions = "1.4"
tempfile = "3.8"

# Property-based testing for edge cases
proptest = "1.4"

# Fuzzing for parser robustness
arbitrary = "1.4"

# Benchmarking for performance regression detection
criterion = { version = "0.5", features = ["html_reports"] }

# Coverage reporting
grcov = "0.8"

# File system utilities
walkdir = "2.4"

# Main compiler binary
[[bin]]
name = "clean-language-compiler"
path = "src/main.rs"

# Core compiler binary (alternative interface)
[[bin]]
name = "cleanc"
path = "src/bin/cleanc.rs"

# Short command line interface
[[bin]]
name = "cln"
path = "src/bin/cln.rs"

# Essential debugging tools
[[bin]]
name = "debug_parser"
path = "src/bin/debug_parser.rs"

[[bin]]
name = "debug_wasm"
path = "src/bin/debug_wasm.rs"

# WebAssembly utilities
[[bin]]
name = "wat2wasm"
path = "src/bin/wat2wasm.rs"

[[bin]]
name = "wasm2wat"
path = "src/bin/wasm2wat.rs"

# Runtime testing
[[bin]]
name = "wasmtime_runner"
path = "src/bin/wasmtime_runner.rs"

# Testing and quality assurance tools
[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"

[[bin]]
name = "coverage_report"
path = "src/bin/coverage_report.rs"

[[bin]]
name = "performance_benchmark"
path = "src/bin/performance_benchmark.rs"



[lib]
name = "clean_language_compiler"
path = "src/lib.rs"

# Temporarily commenting out nonexistent workspace members
#[workspace]
#members = [
#    "parser_test",
#    "parser_fix_test"
#]
#resolver = "2"

#[workspace.dependencies]
#pest = "2.7"
#pest_derive = "2.7" 
# HTTP client temporarily disabled

# Feature flags for WebAssembly runtime selection
[features]
default = ["wasmtime-runtime"]
wasmtime-runtime = ["wasmtime"]
# Temporarily disabled due to version conflicts - kept for config compatibility
wasmer-runtime = ["wasmer"]
both-runtimes = ["wasmtime-runtime", "wasmer-runtime"]
