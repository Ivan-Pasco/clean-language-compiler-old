[package]
name = "clean-language-compiler"
version = "0.30.272"
authors = ["Ivan Pasco Lizarraga"]
edition = "2021"
homepage = "https://www.cleanlanguage.dev"
repository = "https://github.com/cleanlang/clean-language-compiler"
description = "A modern, type-safe programming language that compiles to WebAssembly"
license = "MIT"
readme = "README.md"
keywords = ["compiler", "webassembly", "wasm", "programming-language", "type-safe"]
categories = ["compilers", "wasm", "development-tools"]


[dependencies]
# Parsing
pest = "2.7"
pest_derive = "2.7"
lazy_static = "1.5"

# WebAssembly
wasm-encoder = "0.35"
wasmparser = "0.121"
wat = "1.0.71"

# WebAssembly Runtimes (feature-gated)  
wasmtime = { version = "10.0", optional = true }
wasmer = { version = "4.3", optional = true, features = ["cranelift", "sys"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.21"

# Hashing — SHA-256 for build manifest artifact integrity
# (foundation/spec/plugins/contracts/artifacts.md §5)
sha2 = "0.10"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Package management
dirs = "5.0"

# Utilities
regex = "1.11"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Logging and tracing
env_logger = "0.10"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Memory management and collections
indexmap = "2.0"

# Development tools
tempfile = "3.8"

# HTTP client for real network requests (using native-tls for better macOS compatibility)
reqwest = { version = "0.11", features = ["blocking", "json", "native-tls"], default-features = false }

# Language Server Protocol
tower-lsp = "0.20"

# File watching
notify = "7.0"

# System utilities
libc = "0.2"

[profile.release]
# WebAssembly optimization settings for best performance
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Faster dev builds while maintaining debug info
opt-level = 1
debug = true

[profile.test]
# Optimized testing profile
opt-level = 1
debug = true
codegen-units = 16
incremental = true

[profile.bench]
# Benchmarking profile
opt-level = 3
lto = false
codegen-units = 1

[lints.clippy]
# Pedantic/nursery/cargo are too noisy for this codebase right now
pedantic = "allow"
nursery = "allow"
cargo = "allow"
# Large enums and match blocks are intentional in AST/IR types
large_enum_variant = "allow"
# Cognitive complexity limits don't fit recursive AST walkers
cognitive_complexity = "allow"
# Too many arguments is expected in code generation functions
too_many_arguments = "allow"
# Structural Vec error design in plugins — boxing would change the public API
result_large_err = "allow"
# Compiler algorithm pattern — self is needed for method dispatch in recursive traversals
only_used_in_recursion = "allow"
# Compiler inherently has complex types in codegen and runtime
type_complexity = "allow"
# basic_ops module naming is intentional
module_inception = "allow"
# wasmer runtime pattern — new() returns a configured instance, not Self
new_ret_no_self = "allow"
# Caching the regex would be a larger architectural change
regex_creation_in_loops = "allow"

[lints.rust]
deprecated = "allow"
mismatched_lifetime_syntaxes = "allow"

[dev-dependencies]
# Testing
insta = "1.34"
pretty_assertions = "1.4"
tempfile = "3.8"

# Property-based testing for edge cases
proptest = "1.4"

# Fuzzing for parser robustness
arbitrary = "1.4"

# Benchmarking for performance regression detection
criterion = { version = "0.5", features = ["html_reports"] }

# Coverage reporting
grcov = "0.8"

# File system utilities
walkdir = "2.4"

# Main compiler binary - Complete feature set
# This is the ONE command for everything: compile, run, test, package, lint, debug
[[bin]]
name = "cln"
path = "src/main.rs"

# Essential debugging tools
[[bin]]
name = "debug_parser"
path = "src/bin/debug_parser.rs"

[[bin]]
name = "debug_wasm"
path = "src/bin/debug_wasm.rs"

# WebAssembly utilities
[[bin]]
name = "wat2wasm"
path = "src/bin/wat2wasm.rs"

[[bin]]
name = "wasm2wat"
path = "src/bin/wasm2wat.rs"

# Runtime testing
[[bin]]
name = "wasmtime_runner"
path = "src/bin/wasmtime_runner.rs"

# Testing and quality assurance tools
[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"

[[bin]]
name = "coverage_report"
path = "src/bin/coverage_report.rs"

[[bin]]
name = "performance_benchmark"
path = "src/bin/performance_benchmark.rs"



[lib]
name = "clean_language_compiler"
path = "src/lib.rs"

# Feature flags for WebAssembly runtime selection
[features]
default = ["wasmtime-runtime"]
wasmtime-runtime = ["wasmtime"]
# Temporarily disabled due to version conflicts - kept for config compatibility
wasmer-runtime = ["wasmer"]
both-runtimes = ["wasmtime-runtime", "wasmer-runtime"]

# Benchmark configuration
[[bench]]
name = "compiler_benchmarks"
harness = false
