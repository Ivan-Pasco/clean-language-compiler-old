[package]
name = "clean-language-server"
version = "0.2.2"
edition = "2021"
authors = ["Ivan Pasco"]
description = "Language Server Protocol implementation for Clean Language"
license = "MIT"
repository = "https://github.com/Ivan-Pasco/clean-language-extension"

[[bin]]
name = "clean-language-server"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.15"
lsp-types = "0.91"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "5.0"
ropey = "1.5"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"