[package]
name = "clean-language-server"
version = "0.30.99"
edition = "2021"
authors = ["Clean Language Team"]
description = "Language Server Protocol implementation for Clean Language"
license = "MIT"

[[bin]]
name = "clean-language-server"
path = "src/main.rs"

[dependencies]
# Main compiler integration
clean-language-compiler = { path = ".." }

# LSP dependencies
tower-lsp = "0.20"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
ropey = "1.6"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"