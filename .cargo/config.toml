[build]
# NOTE: Do NOT set `target-cpu=native` here.
#
# `native` compiles CPU-specific instructions (AVX-512, AVX2, etc.) for
# whatever CPU the builder happens to have. When the resulting binary
# runs on a machine with an older/different CPU, execution fails with
# SIGILL (Illegal Instruction). This is exactly what happened to the
# v0.33.57 Linux binary: ubuntu-22.04 builder compiled AVX-512 into
# the binary, and ubuntu-latest (24.04) GitHub Actions runners have
# a CPU without those instructions. See #7d26edd03f80.
#
# For local dev builds you can still opt into it via env:
#   RUSTFLAGS="-C target-cpu=native" cargo build
# without breaking the release binaries.

[test]
# Test configuration
harness = true
# Run tests in parallel for faster execution
jobs = 0

[bench]
# Benchmark configuration
harness = true

[profile.test]
# Optimized testing profile
opt-level = 1
debug = true
codegen-units = 16
incremental = true

[profile.bench]
# Benchmarking profile
opt-level = 3
lto = false
codegen-units = 1

[alias]
# Useful aliases for development
t = "test"
tt = "test --verbose"
tc = "test --color=always"
tb = "bench"
tr = "run"
build = "build"
c = "check"
format = "fmt"
cl = "clippy"

# Testing aliases
test-all = "test --all-targets --all-features"
test-fast = "test --release"
test-slow = "test --no-default-features"
test-parser = "test parser::"
test-semantic = "test semantic::"
test-codegen = "test codegen::"
test-ir = "test ir::"

# Quality assurance aliases
qa = "run --bin test_runner && run --bin performance_benchmark && run --bin coverage_report"
quality = "run --bin test_runner && run --bin performance_benchmark && run --bin coverage_report"