[build]
# Optimize build times
rustflags = ["-C", "target-cpu=native"]

[test]
# Test configuration
harness = true
# Run tests in parallel for faster execution
jobs = 0

[bench]
# Benchmark configuration
harness = true

[profile.test]
# Optimized testing profile
opt-level = 1
debug = true
codegen-units = 16
incremental = true

[profile.bench]
# Benchmarking profile
opt-level = 3
lto = false
codegen-units = 1

[alias]
# Useful aliases for development
t = "test"
tt = "test --verbose"
tc = "test --color=always"
tb = "bench"
tr = "run"
build = "build"
c = "check"
format = "fmt"
cl = "clippy"

# Testing aliases
test-all = "test --all-targets --all-features"
test-fast = "test --release"
test-slow = "test --no-default-features"
test-parser = "test parser::"
test-semantic = "test semantic::"
test-codegen = "test codegen::"
test-ir = "test ir::"

# Quality assurance aliases
qa = "run --bin test_runner && run --bin performance_benchmark && run --bin coverage_report"
quality = "run --bin test_runner && run --bin performance_benchmark && run --bin coverage_report"