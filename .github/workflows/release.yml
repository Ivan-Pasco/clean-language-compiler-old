name: Release Clean Language Compiler

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v0.1.0'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: cln-linux-x86_64
            archive: tar.gz
          # Temporarily disabled ARM64 Linux due to cross-compilation issues
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   name: cln-linux-aarch64
          #   archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cln-macos-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cln-macos-aarch64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cln-windows-x86_64
            archive: zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build binary
      run: cargo build --release --bin cln --target ${{ matrix.target }}
      env:
        OPENSSL_STATIC: 1
        OPENSSL_VENDOR: 1

    - name: Generate compile-options.json
      run: cargo run --release --bin clean-language-compiler --target ${{ matrix.target }} -- options --export-json

    - name: Strip binary (Unix)
      if: matrix.os != 'windows-latest'
      run: strip target/${{ matrix.target }}/release/cln || true

    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cd target/${{ matrix.target }}/release
        tar -czf ../../../${{ matrix.name }}.tar.gz cln
        # Also copy direct binary for cleanmanager compatibility
        cp cln ../../../${{ matrix.name }}
        cd -
        # Include compile-options.json in the archive
        tar -rf ${{ matrix.name }}.tar.gz compile-options.json
        gzip -f ${{ matrix.name }}.tar

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Set-Location "target/${{ matrix.target }}/release"
        7z a "../../../${{ matrix.name }}.zip" cln.exe
        # Also copy direct binary for cleanmanager compatibility
        Copy-Item cln.exe "../../../${{ matrix.name }}.exe"
        Set-Location "../../../"
        # Include compile-options.json in the archive
        7z a "${{ matrix.name }}.zip" compile-options.json

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: |
          ${{ matrix.name }}.${{ matrix.archive }}
          ${{ matrix.name }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          compile-options.json

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Move artifacts to root
      run: |
        # Move archives
        find artifacts -name "*.tar.gz" -o -name "*.zip" | while read file; do
          mv "$file" .
        done
        # Move direct binaries for cleanmanager compatibility
        find artifacts -name "cln-linux-*" -type f | while read file; do
          mv "$file" .
        done
        find artifacts -name "cln-macos-*" -type f | while read file; do
          mv "$file" .
        done
        find artifacts -name "cln-windows-*.exe" -type f | while read file; do
          mv "$file" .
        done
        # Move compile-options.json (use the first one found, they're all the same)
        find artifacts -name "compile-options.json" -type f | head -1 | while read file; do
          mv "$file" .
        done
        # List what we have
        ls -la *.tar.gz *.zip cln-* compile-options.json 2>/dev/null || echo "Some files may be missing"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.tar.gz
          *.zip
          cln-linux-x86_64
          cln-linux-aarch64
          cln-macos-x86_64
          cln-macos-aarch64
          cln-windows-x86_64.exe
          compile-options.json
        body: |
          ## Clean Language Compiler ${{ github.ref_name }}
          
          **Author:** Ivan Pasco Lizarraga  
          **Website:** https://www.cleanlanguage.dev  
          
          Pre-built binaries for the Clean Language compiler.
          
          ### Installation
          
          Download the appropriate binary for your platform and add it to your PATH.
          
          ### Platforms
          
          Choose between direct binaries (for cleanmanager) or archives:
          
          - **Linux x86_64**: `cln-linux-x86_64` or `cln-linux-x86_64.tar.gz`
          - **Linux ARM64**: `cln-linux-aarch64` or `cln-linux-aarch64.tar.gz`
          - **macOS x86_64**: `cln-macos-x86_64` or `cln-macos-x86_64.tar.gz`
          - **macOS ARM64**: `cln-macos-aarch64` or `cln-macos-aarch64.tar.gz`
          - **Windows x86_64**: `cln-windows-x86_64.exe` or `cln-windows-x86_64.zip`
          
          ### Usage
          
          ```bash
          # Compile a Clean Language file
          cln compile hello.cln
          
          # Run a Clean Language program
          cln run hello.cln
          
          # Check version
          cln version
          ```
          
          For more information, visit: https://www.cleanlanguage.dev
        draft: false
        prerelease: false 