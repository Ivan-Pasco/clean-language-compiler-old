name: Release Clean Language Compiler

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v0.1.0'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Build linux artifact on ubuntu-22.04 (glibc 2.35) rather than
          # ubuntu-latest (= ubuntu-24.04 with glibc 2.39). Binaries linked
          # against glibc 2.39 fail to load on any host with an older glibc —
          # including the GitHub-hosted ubuntu-22.04 runners that downstream
          # CIs (clean-framework Phase 1) use — surfacing as
          # "Binary failed to execute: exit code -1" from the cleen-install
          # validator (RUNTIME-LINUX-EXEC, fp 5c1153782d23). Building on the
          # older glibc preserves forward compatibility with every newer host.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: cln-linux-x86_64
            archive: tar.gz
          # Temporarily disabled ARM64 Linux due to cross-compilation issues
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   name: cln-linux-aarch64
          #   archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cln-macos-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cln-macos-aarch64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cln-windows-x86_64
            archive: zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build compiler binary
      run: cargo build --release --bin cln --target ${{ matrix.target }}
      env:
        OPENSSL_STATIC: 1
        OPENSSL_VENDOR: 1

    - name: Build language server binary
      run: cargo build --release --bin clean-language-server --manifest-path language-server/Cargo.toml --target ${{ matrix.target }}
      env:
        OPENSSL_STATIC: 1
        OPENSSL_VENDOR: 1
        CARGO_TARGET_DIR: target

    - name: Build wasmtime_runner binary
      run: cargo build --release --bin wasmtime_runner --target ${{ matrix.target }}
      env:
        OPENSSL_STATIC: 1
        OPENSSL_VENDOR: 1

    - name: Generate compile-options.json (Unix)
      if: matrix.os != 'windows-latest'
      run: ./target/${{ matrix.target }}/release/cln options --export-json

    - name: Generate compile-options.json (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: .\target\${{ matrix.target }}\release\cln.exe options --export-json

    - name: Strip binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        strip target/${{ matrix.target }}/release/cln || true
        strip target/${{ matrix.target }}/release/clean-language-server || true
        strip target/${{ matrix.target }}/release/wasmtime_runner || true

    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p release-package
        cp target/${{ matrix.target }}/release/cln release-package/
        cp target/${{ matrix.target }}/release/clean-language-server release-package/
        cp target/${{ matrix.target }}/release/wasmtime_runner release-package/
        cp compile-options.json release-package/
        tar -czf ${{ matrix.name }}.tar.gz -C release-package .
        # Also copy direct binaries for cleanmanager compatibility
        cp target/${{ matrix.target }}/release/cln ${{ matrix.name }}
        # Language server: derive name by replacing 'cln-' prefix
        ls_name=$(echo "${{ matrix.name }}" | sed 's/^cln-/clean-language-server-/')
        cp target/${{ matrix.target }}/release/clean-language-server "$ls_name"

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Set-Location "target/${{ matrix.target }}/release"
        7z a "../../../${{ matrix.name }}.zip" cln.exe clean-language-server.exe wasmtime_runner.exe
        # Also copy direct binary for cleanmanager compatibility
        Copy-Item cln.exe "../../../${{ matrix.name }}.exe"
        $lsName = "${{ matrix.name }}" -replace '^cln-', 'clean-language-server-'
        Copy-Item clean-language-server.exe "../../../${lsName}.exe"
        Set-Location "../../../"
        # Include compile-options.json in the archive
        7z a "${{ matrix.name }}.zip" compile-options.json

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: |
          ${{ matrix.name }}.${{ matrix.archive }}
          ${{ matrix.name }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          compile-options.json
          clean-language-server-*${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Move artifacts to root
      run: |
        # Move archives
        find artifacts -name "*.tar.gz" -o -name "*.zip" | while read file; do
          mv "$file" .
        done
        # Move direct binaries for cleanmanager compatibility
        find artifacts -name "cln-linux-*" -type f | while read file; do
          mv "$file" .
        done
        find artifacts -name "cln-macos-*" -type f | while read file; do
          mv "$file" .
        done
        find artifacts -name "cln-windows-*.exe" -type f | while read file; do
          mv "$file" .
        done
        # Move language server direct binaries
        find artifacts -name "clean-language-server-*" -type f | while read file; do
          mv "$file" .
        done
        # Move compile-options.json (use the first one found, they're all the same)
        find artifacts -name "compile-options.json" -type f | head -1 | while read file; do
          mv "$file" .
        done
        # List what we have
        ls -la *.tar.gz *.zip cln-* clean-language-server-* compile-options.json 2>/dev/null || echo "Some files may be missing"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.tar.gz
          *.zip
          cln-linux-x86_64
          cln-linux-aarch64
          cln-macos-x86_64
          cln-macos-aarch64
          cln-windows-x86_64.exe
          clean-language-server-linux-x86_64
          clean-language-server-linux-aarch64
          clean-language-server-macos-x86_64
          clean-language-server-macos-aarch64
          clean-language-server-windows-x86_64.exe
          compile-options.json
        body: |
          ## Clean Language Compiler ${{ github.ref_name }}
          
          **Author:** Ivan Pasco Lizarraga  
          **Website:** https://www.cleanlanguage.dev  
          
          Pre-built binaries for the Clean Language compiler.
          
          ### Installation
          
          Download the appropriate binary for your platform and add it to your PATH.
          
          ### Platforms

          Choose between direct binaries (for cleanmanager) or archives:

          - **Linux x86_64**: `cln-linux-x86_64` or `cln-linux-x86_64.tar.gz`
          - **Linux ARM64**: `cln-linux-aarch64` or `cln-linux-aarch64.tar.gz`
          - **macOS x86_64**: `cln-macos-x86_64` or `cln-macos-x86_64.tar.gz`
          - **macOS ARM64**: `cln-macos-aarch64` or `cln-macos-aarch64.tar.gz`
          - **Windows x86_64**: `cln-windows-x86_64.exe` or `cln-windows-x86_64.zip`

          ### Language Server (LSP)

          The archive includes `clean-language-server` alongside `cln`. Standalone binaries are also provided:

          - **Linux x86_64**: `clean-language-server-linux-x86_64`
          - **macOS ARM64**: `clean-language-server-macos-aarch64`
          - **Windows x86_64**: `clean-language-server-windows-x86_64.exe`
          
          ### Usage
          
          ```bash
          # Compile a Clean Language file
          cln compile hello.cln
          
          # Run a Clean Language program
          cln run hello.cln
          
          # Check version
          cln version
          ```
          
          For more information, visit: https://www.cleanlanguage.dev
        draft: false
        prerelease: false

    - name: Notify clean-errors to rebuild verifier image
      if: success() && env.DISPATCH_PAT != ''
      env:
        DISPATCH_PAT: ${{ secrets.CLEAN_ERRORS_DISPATCH_PAT }}
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        curl -fsSL -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${DISPATCH_PAT}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/Ivan-Pasco/clean-errors/dispatches \
          -d "{\"event_type\":\"compiler-released\",\"client_payload\":{\"version\":\"${VERSION}\"}}"
