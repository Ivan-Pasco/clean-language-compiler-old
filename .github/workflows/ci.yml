name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          build/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      env:
        # Lock the plugin-registry drift gate to ON in CI, independent of the
        # in-code default. Set to `off` only for an emergency green build while
        # cross-component cleanup is mid-flight; never check `off` into main.
        CLEAN_PLUGIN_REGISTRY_VALIDATION: all
      run: cargo test --verbose

    - name: Test cln binary
      run: |
        cargo build --bin cln
        ./target/debug/cln --version

  # Reproduces (in codegen-shape terms) what the clean-errors follow-up
  # ticket #54887260abf6 asked for:
  #
  #   "add a smoke test in their CI that literally builds this dashboard's
  #    main.cln and curls the URLs — that would have caught the 0.33.44
  #    regression before it shipped."
  #
  # We can't run the actual /tasks endpoint in CI (needs MySQL + clean-server
  # + full frame.server bridges). But the WASM the compiler emits IS the
  # delivery contract for both regression classes:
  #
  #   * #3957fce40e09 (0.33.41-43): missing boxing before a boxed-Any wrapper
  #   * #54887260abf6 (0.33.44):    spurious boxing before an expand_strings=true
  #                                 wrapper — the 0.33.44 regression
  #
  # `tests/test_dashboard_shape_canary.rs` compiles a fixture that mirrors
  # `tasks_list_page`'s shape (sequential concats + interleaved db.query calls
  # + json.get inside a while-loop accumulator) and inspects the emitted WAT
  # to catch either class before it ships.
  dashboard-shape-canary:
    name: Dashboard-shape codegen smoke test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-dashboard-canary-${{ hashFiles('**/Cargo.lock') }}

    # The canary compiles with `--plugins`, so the release cln binary AND
    # wasm2wat must both exist. Build them explicitly before the test.
    - name: Build release cln + wasm2wat
      run: |
        cargo build --release --bin cln
        cargo build --release --bin wasm2wat

    - name: Run dashboard-shape canary
      run: cargo test --release --test test_dashboard_shape_canary -- --nocapture

  plugin-registry-contract:
    name: Plugin Registry Contract
    runs-on: ubuntu-latest
    steps:
    - name: Checkout compiler
      uses: actions/checkout@v4
      with:
        path: clean-language-compiler

    # Checks out clean-framework as a sibling so the integration test at
    # tests/test_plugin_registry_contract.rs::framework_plugins_match_registry
    # can find plugin.toml manifests at ../clean-framework/plugins/.
    # Pinned to `main` so any drift between framework plugin.toml entries
    # and foundation/platform-architecture/function-registry.toml surfaces
    # immediately, not at the next framework release bump.
    - name: Checkout framework (main)
      uses: actions/checkout@v4
      with:
        repository: Ivan-Pasco/cleen-framework
        ref: main
        path: clean-framework

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-contract-${{ hashFiles('clean-language-compiler/Cargo.lock') }}

    - name: Run plugin registry contract test
      working-directory: clean-language-compiler
      env:
        CLEAN_PLUGIN_REGISTRY_VALIDATION: all
      run: cargo test --test test_plugin_registry_contract framework_plugins_match_registry -- --nocapture

  build-test:
    name: Build Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build cln binary
      run: cargo build --bin cln --release

    - name: Test cln binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        ./target/release/cln --version
        echo "Testing cln binary works on ${{ matrix.os }}"

    - name: Test cln binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\target\release\cln.exe --version
        echo "Testing cln binary works on ${{ matrix.os }}" 