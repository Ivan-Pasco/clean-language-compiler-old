name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          build/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      env:
        # Lock the plugin-registry drift gate to ON in CI, independent of the
        # in-code default. Set to `off` only for an emergency green build while
        # cross-component cleanup is mid-flight; never check `off` into main.
        CLEAN_PLUGIN_REGISTRY_VALIDATION: all
      run: cargo test --verbose

    - name: Test cln binary
      run: |
        cargo build --bin cln
        ./target/debug/cln --version

  build-test:
    name: Build Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build cln binary
      run: cargo build --bin cln --release

    - name: Test cln binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        ./target/release/cln --version
        echo "Testing cln binary works on ${{ matrix.os }}"

    - name: Test cln binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\target\release\cln.exe --version
        echo "Testing cln binary works on ${{ matrix.os }}" 