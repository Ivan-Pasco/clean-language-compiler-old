# Clean Language Platform - Shared Function Registry
#
# This file is the authoritative source of truth for all host functions
# exposed to Clean Language WASM modules. It covers Layer 2 (portable
# host-bridge) and Layer 3 (server-only extensions).
#
# Source of truth for Layer 2 signatures: host-bridge/tests/spec_compliance.wat
# Source of truth for Layer 3 signatures: clean-server/src/bridge.rs
#
# ============================================================
# TYPE EXPANSION RULES
# ============================================================
#
#   "string"  -> WASM (i32, i32) or i32  see VALIDATOR COMPARISON RULE
#                                        below for the expand_strings branch
#   "integer" -> WASM (i64)        64-bit signed integer
#   "number"  -> WASM (f64)        64-bit float
#   "boolean" -> WASM (i32)        0 = false, 1 = true
#   "i32"     -> WASM (i32)        raw 32-bit int (port, count, handler index)
#   "i64"     -> WASM (i64)        raw 64-bit int
#   "ptr"     -> WASM (i32)        return only: length-prefixed string pointer
#                                  format: [4-byte LE length][UTF-8 data]
#   "void"    -> no return value
#
# ============================================================
# ALIAS CONVENTION
# ============================================================
#
#   canonical name: underscore style (e.g., math_sin)
#   aliases: dot notation or camelCase variants (e.g., math.sin)
#   auto-alias rule: for any function named _namespace_fn, the alias namespace.fn
#   is also generated by the compiler and must be registered by all host implementations.
#   Hosts should derive and register these automatically rather than listing them manually.
#
# ============================================================
# VALIDATOR COMPARISON RULE
# ============================================================
#
#   The compiler validator (RegistryIndex::check_bridge) compares plugin
#   manifests to this registry at the WASM-import-shape level, not the
#   type-designator level. The same WASM i32 can be described correctly
#   as "string" (with expand_strings = false), "i32", "boolean", or
#   "handler" — they all emit a single i32 import. The validator expands
#   both sides into the WASM type sequence the linker actually sees, then
#   compares those.
#
#   "string" expansion rules:
#     plugin side: depends on the plugin's expand_strings flag.
#                  true  -> [i32, i32] (ptr+len pair, wrapper unpacks)
#                  false -> [i32]      (single lp-ptr, passed as-is)
#     registry side: always uses the "expand" convention (ptr+len pair).
#                    A registry entry written with "string" matches plugin
#                    entries that have expand_strings = true.
#
#   Practical consequence: an entry that uses length-prefixed string
#   pointers (single i32 per string, e.g. _session_store, _http_set_cookie)
#   is described in this registry with "i32" params; the matching plugin
#   entry uses "string" without expand_strings, and both sides emit the
#   same WASM. The validator agrees.
#
#   Full design and rationale: foundation/management/cross-component-prompts/
#   foundation-bridge-string-type-semantics.md (Resolution section).
#
# ============================================================
# HOST SCOPING (`hosts` field)
# ============================================================
#
#   hosts = ["server"]            implemented by every server-class host:
#                                 clean-server (Rust/wasmtime) AND
#                                 clean-node-server (Node.js). Apps
#                                 compiled against the framework call
#                                 these regardless of which server-class
#                                 host runs them, so both must implement.
#   hosts = ["browser"]           implemented by browser hosts (frame.ui /
#                                 frame.canvas / frame.client runtimes);
#                                 not expected to resolve on server-class
#                                 hosts.
#   hosts = ["server", "browser"] portable across server-class and browser
#                                 hosts (UI functions with SSR stubs, etc).
#   hosts = ["all"]               every host must implement (pure compute,
#                                 stdlib, primitives).
#   hosts = []                    legacy / unrestricted; treated as "any host
#                                 may implement, no host filter applied".
#
#   The compiler validator (RegistryIndex::check_bridge) requires plugin-
#   declared hosts to be a subset of the registry's hosts when populated.
#   Empty hosts disables the host check for backward compatibility with
#   pre-2026-06 entries.
#
#   Contract tests filter probes by host: every server-class host runs the
#   same probe set (entries where hosts is empty, contains "server", or
#   contains "all"); browser hosts run their own equivalent contract tests
#   against their linkers. See foundation/management/scripts/
#   check_host_parity.py for the parity gate.
#
# ============================================================

[meta]
version = "1.0.0"
generated_from = [
    "host-bridge/tests/spec_compliance.wat",
    "host-bridge/src/wasm_linker/console.rs",
    "host-bridge/src/wasm_linker/math.rs",
    "host-bridge/src/wasm_linker/string_ops.rs",
    "host-bridge/src/wasm_linker/database.rs",
    "host-bridge/src/wasm_linker/file_io.rs",
    "host-bridge/src/wasm_linker/http_client.rs",
    "host-bridge/src/wasm_linker/crypto_funcs.rs",
    "host-bridge/src/wasm_linker/env_time.rs",
    "host-bridge/src/wasm_linker/memory.rs",
    "src/bridge.rs",
]

