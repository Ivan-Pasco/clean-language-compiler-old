# =============================================================================
# Clean Runtime ABI — v1.0.0 (frozen)
# =============================================================================
#
# Purpose
# -------
# Catalog every WASM host bridge function the compiler registers via
# `src/plugins/wasm_adapter.rs::setup_linker` for the plugin sandbox.
# This is the machine-readable companion to
# `foundation/spec/plugins/contracts/runtime-abi.md` (§7 illustrates the shape;
# §10 gives a skeleton example; §11 identifies this file's location).
#
# Consumed by
# -----------
# Phase D S5 of the v3 typed emission migration will replace the ~11
# hand-maintained `register_*` helpers in `wasm_adapter.rs` with a
# schema-driven loop that reads this file and registers each `[[bridge]]`
# entry programmatically. The refactor is atomic: every bridge listed below
# must be enumerated with the correct WASM signature or plugin instantiation
# will fail with "unknown import" (the frame.locale-pilot failure mode that
# motivated the v3 plan).
#
# Authority
# ---------
# BEFORE Phase D S5 lands: `wasm_adapter.rs::setup_linker` is authoritative.
# This file is a derived enumeration; keep it in sync when adding bridges.
# AFTER Phase D S5 lands: this file is authoritative. `wasm_adapter.rs`
# becomes a schema-driven loop that reads these entries. Any new v1 bridge
# MUST be added here first; the compiler will then register it automatically.
#
# Update discipline
# -----------------
# - Increment `version` per §6 of runtime-abi.md (patch for typos, minor for
#   additive imports, major for signature changes or removals).
# - New entries: use `semantics = "stub"` if the closure returns a constant
#   with no meaningful work, `semantics = "wired"` if it calls into a real
#   Rust helper or manipulates plugin state / memory.
# - `host_class` matches `bridge-host-classes.md` §2 vocabulary:
#     "all"     — every host implements it
#     "server"  — server hosts (clean-server, clean-node-server) only
#     "browser" — browser hosts only
#     "native"  — CLI / embedded runtimes only
#   Multiple values allowed: host_class = ["server", "native"].
#   For sandbox stubs (this file), most entries use "all" — the sandbox is
#   host-class-agnostic; real hosts implement selectively per their manifest.
# - `source` is a soft reference back to `wasm_adapter.rs` at the time of
#   authoring. It documents intent for readers; the schema-driven loop does
#   NOT parse it. Line numbers may drift.
#
# Non-goals
# ---------
# - This file does NOT catalog plugin-declared bridges (those live in each
#   plugin's `plugin.toml [[bridge.functions]]`).
# - This file does NOT catalog the deployed host bridge (that's
#   `HOST_BRIDGE.md` — a distinct surface, see runtime-abi.md §2).
# - Legacy `expand_preambles` / `_start` no-op / `events:` detection are NOT
#   bridges and are not represented here (they are compiler-side rewrites
#   scheduled for Phase D S4 deletion).
#
# Enumeration audit
# -----------------
# Source-of-truth grep at authoring time:
#     $ grep -c 'func_wrap(' src/plugins/wasm_adapter.rs
#     150
# Every `func_wrap` site in that file corresponds to exactly one `[[bridge]]`
# entry below. Total below MUST equal that grep count for the S5 refactor to
# be safe. Verify before shipping S5:
#     bridges_in_toml == func_wrap_sites_in_wasm_adapter
# If the two disagree, S5 will fail plugin instantiation with "unknown import".
#
# =============================================================================

version = "1.0.0"
status  = "frozen"

