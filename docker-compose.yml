version: '3.8'

services:
  compiler:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo test
    environment:
      - RUST_BACKTRACE=1

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run -- --help
    environment:
      - RUST_BACKTRACE=1

  wasm-test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo test --test integration_tests
    environment:
      - RUST_BACKTRACE=1 

  run-test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run -- test.cln
    environment:
      - RUST_BACKTRACE=1

  wasm-runner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run --bin wasmtime_runner -- /app/output.wasm
    environment:
      - RUST_BACKTRACE=1
    depends_on:
      - compiler

  wasm-exec:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "cargo run --bin cleanc -- /app/examples/hello.cln && cargo run --bin wasmtime_runner -- /app/output.wasm"
    environment:
      - RUST_BACKTRACE=1 