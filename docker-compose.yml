version: '3.8'

services:
  compiler:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo test
    environment:
      - RUST_BACKTRACE=1

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run -- --help
    environment:
      - RUST_BACKTRACE=1

  wasm-test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo test --test integration_tests
    environment:
      - RUST_BACKTRACE=1 

  run-test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run -- test.cln
    environment:
      - RUST_BACKTRACE=1

  wasm-runner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run --bin wasmtime_runner -- /app/output.wasm
    environment:
      - RUST_BACKTRACE=1
    depends_on:
      - compiler

  wasm-exec:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "cargo run --bin cleanc -- /app/examples/hello.cln && cargo run --bin wasmtime_runner -- /app/output.wasm"
    environment:
      - RUST_BACKTRACE=1

  # 🚀 BULLETPROOF TESTING SERVICES

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run --bin test_runner
    environment:
      - RUST_BACKTRACE=1

  performance-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run --bin performance_benchmark
    environment:
      - RUST_BACKTRACE=1

  coverage-report:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo run --bin coverage_report
    environment:
      - RUST_BACKTRACE=1

  quality-gate:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "cargo test && cargo run --bin test_runner && cargo run --bin performance_benchmark && cargo run --bin coverage_report"
    environment:
      - RUST_BACKTRACE=1
    depends_on:
      - test-runner
      - performance-benchmark
      - coverage-report 